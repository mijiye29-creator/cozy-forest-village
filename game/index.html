<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포근한 숲속 마을</title>
<style>
:root{
  --bg:#e4eee2; --panel:#f5faf3; --ink:#22352b; --sub:#66796d; --line:#cddccb;
  --moss:#3f7a55; --coin:#f0bb3f; --coinInk:#4a3600; --rose:#e2768a; --off:#d3ddd1;
  box-sizing:border-box;
  padding:0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16221b; --panel:#1f2f26; --ink:#e6f0e4; --sub:#9fb4a5; --line:#31463a;
    --moss:#7bc596; --coin:#f0bb3f; --coinInk:#3a2b00; --rose:#ee8fa0; --off:#2a3c31;
  }
}
:root[data-theme="dark"]{
  --bg:#16221b; --panel:#1f2f26; --ink:#e6f0e4; --sub:#9fb4a5; --line:#31463a;
  --moss:#7bc596; --coin:#f0bb3f; --coinInk:#3a2b00; --rose:#ee8fa0; --off:#2a3c31;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  display:flex;justify-content:center;overflow:hidden;
}
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column}
header{position:absolute;z-index:4;left:0;right:0;top:env(safe-area-inset-top,0px);height:70px;padding:12px 15px;display:flex!important;gap:10px;pointer-events:none;background:linear-gradient(#e7ede3dd,#e7ede300)}
.coins{background:#f8f5e9; border:1px solid #cbd2c2;border-radius:16px;padding:6px 12px 6px 7px;gap:8px;box-shadow:0 3px 10px #334a3610}
.coins.bump{animation:cbump .22s ease-out}
@keyframes cbump{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.coinIcon{width:25px;height:25px;font-size:13px;background:#d7c18e;color:#675637;box-shadow:none;border:0}
#coins{color:#30483c!important;font-size:20px!important;font-weight:650;letter-spacing:-.04em}
.meta{margin-left:auto;align-self:center;color:#344d40;background:#f8f5e9e8;border:1px solid #cbd2c2;border-radius:14px;padding:7px 12px;font-size:11px;line-height:1.6}
/* v55 (staff 6): on phones the village/worker text wrapped into 4-5 lines and pushed the map down - keep it to one short line */
.meta div{white-space:nowrap}
@media (max-width:460px){.meta{font-size:11px}#m2{display:none}}

.inv{display:flex;gap:5px;overflow-x:auto;padding:0 10px 6px;flex:none;scrollbar-width:none;min-height:34px;align-items:center}
.inv::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:2px;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;
  padding:1px 8px 1px 3px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.chip canvas{width:22px;height:22px;display:block}
.chip small{font-weight:600;color:var(--sub);font-size:10.5px;margin-left:3px}
.chip.zero{opacity:.45}
.chip.hot{border-color:var(--coin);box-shadow:0 0 0 2px rgba(240,187,63,.35)}
.chip.hot::after{content:'+50%';font-size:9.5px;font-weight:800;color:#e2463c;margin-left:3px}
.inv .sep{width:1px;height:18px;background:var(--line);flex:none;margin:0 2px}

.tabs{display:flex;gap:6px;padding:0 10px 6px;flex:none}
.tab{flex:1;position:relative;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 2px;
  font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer}
.tab.on{background:var(--moss);color:#fff;border-color:var(--moss)}
.tab .dot{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--rose);display:none}
.tab.has .dot{display:block}
.tab:focus-visible,.card:focus-visible,#mode:focus-visible,.reset:focus-visible{outline:3px solid var(--moss);outline-offset:2px}

.drawer{flex:none;max-height:40vh;overflow-y:auto;padding:0 10px 8px}
.drawer[hidden]{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel);border:1.5px solid var(--line);
  border-radius:12px;padding:7px 8px;color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.card .top{display:flex;align-items:center;gap:6px;min-width:0}
.card canvas{width:28px;height:28px;flex:none}
.card .nm{font-weight:700;font-size:13px;line-height:1.2;min-width:0}
.card .nm small{display:block;font-weight:500;color:var(--sub);font-size:11px}
.card .ds{font-size:11px;color:var(--sub);line-height:1.3;flex:1}
.card .cost{align-self:flex-end;background:var(--coin);color:var(--coinInk);font-weight:800;font-size:12.5px;border-radius:999px;
  padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card.off{opacity:.62}
.card.off .cost{background:var(--off);color:var(--sub)}
.card.max .cost{background:transparent;color:var(--moss)}
.card:active:not(.off):not(.max){transform:scale(.98)}
.wlist{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.wlist:empty{display:none}
.wrole{font-size:10.5px;font-weight:600;color:var(--sub);margin-left:3px}
.whead{font-size:11.5px;color:var(--sub);font-weight:700;padding:4px 2px 0}
.staffBoard{grid-column:1/-1;background:linear-gradient(135deg,rgba(63,122,85,.11),rgba(240,187,63,.10));border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px}
.staffTop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.staffTitle{font-size:13px;font-weight:800}
.staffCount{font-size:10.5px;color:var(--sub);font-weight:700}
.staffRows{display:flex;flex-direction:column;gap:5px}
.staffRow{display:grid;grid-template-columns:minmax(70px,.9fr) minmax(74px,1fr) minmax(82px,1.15fr);align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11.5px;min-width:0}
.staffName{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staffJob{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staffState{display:flex;align-items:center;gap:5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staffDot{width:7px;height:7px;border-radius:50%;background:#69b77a;flex:none}
.staffState.wait .staffDot{background:#e9b84b}.staffState.alert .staffDot{background:#e2768a}
.staffEmpty{font-size:11.5px;color:var(--sub);padding:3px 1px}
.wrow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px}
.wrow canvas{width:28px;height:28px;flex:none}
.wi{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.2}
.wi small{display:block;font-weight:500;color:var(--sub);font-size:11px}
.wbtns{display:flex;gap:5px;flex:none}
.wbtn{border:none;border-radius:10px;background:var(--coin);color:var(--coinInk);font:inherit;font-size:10.5px;font-weight:700;padding:4px 7px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:60px}
.wbtn b{font-size:12px;font-variant-numeric:tabular-nums}
.wbtn.off{background:var(--off);color:var(--sub)}
.wbtn:disabled{background:transparent;color:var(--moss);cursor:default}
.wbtn:focus-visible{outline:3px solid var(--moss);outline-offset:2px}
.reset{grid-column:1/-1;justify-self:center;background:none;border:none;color:var(--sub);font:inherit;font-size:11.5px;
  text-decoration:underline;padding:6px;cursor:pointer}

.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;padding:0 10px 8px}
.cwrap{position:relative;width:100%}
canvas#c{display:block;width:100%;height:auto;border-radius:16px;touch-action:none;box-shadow:0 0 0 2px var(--line)}
#hint{position:absolute;left:62%;bottom:2.4%;transform:translateX(-50%);width:max-content;max-width:66%;text-align:center;line-height:1.4;white-space:pre-line;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  background:rgba(34,53,43,.84);color:#f5faf3;font-size:12px;padding:5px 11px;border-radius:12px;pointer-events:none;transition:opacity .4s}
#hint.hide{opacity:0}
#mode{position:absolute;left:8px;bottom:8px;border:none;border-radius:999px;padding:8px 14px;min-height:40px;font:inherit;font-weight:700;
  font-size:12.5px;background:var(--moss);color:#fff;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#mode.auto{background:var(--rose)}
.snd{position:absolute;left:8px;bottom:56px;display:flex;gap:8px}
.snd button{width:40px;height:40px;border:none;border-radius:50%;background:rgba(34,53,43,.78);color:#fff;font-size:15px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.snd button.off{background:rgba(120,130,122,.7);opacity:.75}
.snd button:focus-visible{outline:3px solid var(--moss);outline-offset:2px}

@media (min-width:820px){
  .app{max-width:980px;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto auto minmax(0,1fr);
    grid-template-areas:"hd hd" "st iv" "st tb" "st dr";column-gap:4px}
  header{grid-area:hd}.inv{grid-area:iv;flex-wrap:wrap}.tabs{grid-area:tb}.drawer{grid-area:dr;max-height:none}
  .stage{grid-area:st;align-items:center}
}
.tab[hidden]{display:none!important}
#gear{position:absolute;left:8px;bottom:8px;width:40px;height:40px;border:none;border-radius:12px;background:rgba(255,252,240,.95);font-size:19px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18);display:grid;place-items:center}
#gear[aria-expanded="true"]{background:#f0bb3f}
#gear:focus-visible{outline:3px solid var(--moss);outline-offset:2px}
#setp{position:absolute;left:8px;bottom:56px;background:rgba(255,252,240,.97);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;min-width:180px}
#setp[hidden]{display:none}
#setp .srow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:12.5px;color:#4a3a2c}
#setp #mode{position:static;min-height:36px;padding:6px 12px}
#setp .snd{position:static}
#setp .snd button{width:36px;height:36px}
#newGame{border:none;border-radius:999px;padding:7px 12px;font:inherit;font-weight:700;font-size:12px;background:#efe3cf;color:#6b4a2a;cursor:pointer}
#newGame.armed{background:#e2566a;color:#fff}
#hint{left:50%!important;max-width:84%!important;font-size:13.5px!important;font-weight:700;padding:7px 13px!important;border-radius:14px!important;bottom:12px!important;white-space:pre-line!important;
  display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important;
  background:rgba(28,44,35,.93)!important;box-shadow:0 3px 10px rgba(0,0,0,.25);border:2px solid rgba(255,226,122,.75)}
header{position:absolute;z-index:4;left:0;right:0;top:env(safe-area-inset-top,0px);height:70px;padding:12px 15px;display:flex!important;gap:10px;pointer-events:none;background:linear-gradient(#e7ede3dd,#e7ede300)}
header .meta{justify-self:end}
#hint{bottom:auto!important;top:46px}
#goal{position:absolute;left:8px;top:44px;z-index:4;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;max-width:60%;border:2px solid #e08f3c;background:rgba(255,246,226,.96);color:#4a3a2c;
  border-radius:14px;padding:5px 10px;font:inherit;cursor:pointer;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.12)}
#goal[hidden]{display:none}
#goal .gt{font-size:13px;font-weight:800;display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
#goal .gt b{color:#3f7a55}
#goal .gb{display:block;height:6px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden}
#goal .gb i{display:block;height:100%;background:#e08f3c;border-radius:3px;transition:width .3s}
#goal .gn{font-size:12px;font-weight:700;color:#b3263b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal:focus-visible{outline:3px solid var(--moss);outline-offset:2px}
#goal{position:static;display:inline-flex;align-items:center;gap:4px;max-width:none;min-width:0;padding:3px 9px;border-width:1.5px;box-shadow:none;margin-left:2px}
#goal .gb,#goal .gn{display:none}
#goal .gt{white-space:nowrap;font-size:11.5px}
#goalList{position:fixed;left:8px;top:104px;z-index:5;background:#fff6e2;border:2px solid #e08f3c;border-radius:14px;padding:8px 12px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:5px;min-width:220px}
#goalList[hidden]{display:none}
#goalList div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:700;color:#4a3a2c}
#goalList div.ok{color:#3f7a55}
#goalList div span:last-child{font-variant-numeric:tabular-nums}
#goalList div:not(.ok) span:last-child{color:#b3263b}
/* v53 (staff 6): title screen + joystick sensitivity */
#title{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;padding:0 24px calc(44px + env(safe-area-inset-bottom,0px));z-index:19}
#title[hidden]{display:none}
#ending{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;border-radius:16px;background:linear-gradient(180deg,rgba(28,48,36,.5),rgba(10,20,15,.88))}
#ending[hidden]{display:none}
#title .tcard{width:min(84%,320px);background:#fff6e2;border:3px solid #e08f3c;border-radius:22px;padding:22px 18px 16px;text-align:center;color:#4a3a2c;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#title .tlogo{font-size:11px;font-weight:650;letter-spacing:.25em;line-height:1.6;color:#9b855d}
#title h1{font-size:29px;font-weight:650;letter-spacing:-.055em;color:#304d3d;margin:10px 0 10px}
#title .tsub{color:#7b8472;font-size:12px;font-weight:450;line-height:1.75;word-break:keep-all;margin:0 auto 20px;max-width:240px}
#startBtn{display:block;width:100%;min-height:51px;border:0;background:#456552;color:#fffcef;box-shadow:0 3px 0 #324e3d;border-radius:13px;font:inherit;font-size:15px;font-weight:650;cursor:pointer;touch-action:manipulation}
#startBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #2a5a3c}
#startBtn:focus-visible{outline:3px solid #e08f3c;outline-offset:3px}
#title .tinfo{margin-top:10px;font-size:12.5px;font-weight:700;color:#6b5a44;min-height:1em}
#title .tver{margin-top:12px;font-size:9px;letter-spacing:.1em;color:#939d8b}
#sensBtn{border:none;border-radius:999px;padding:7px 12px;font:inherit;font-weight:700;font-size:12px;background:#efe3cf;color:#6b4a2a;cursor:pointer;min-width:84px}
#setp .sver{font-size:11px;color:#9a8a74;text-align:right}
/* v64: bear countdown sits in the header next to the coins */
#bearChip{grid-column:2;grid-row:1;display:inline-flex;align-items:center;white-space:nowrap;border-radius:999px;padding:5px 13px;font-size:16px;letter-spacing:.02em;font-weight:800;color:#fff;background:rgba(34,53,43,.82);font-variant-numeric:tabular-nums}
#bearChip[hidden]{display:none}
#bearChip.warn{background:#d63446;animation:bcp .6s ease-in-out infinite alternate}
#bearChip.raid{background:#d63446}
#bearChip.calm{background:#2f68a0}
@keyframes bcp{from{transform:scale(1)}to{transform:scale(1.08)}}
.coins{background:#f8f5e9; border:1px solid #cbd2c2;border-radius:16px;padding:6px 12px 6px 7px;gap:8px;box-shadow:0 3px 10px #334a3610}
.meta{margin-left:auto;align-self:center;color:#344d40;background:#f8f5e9e8;border:1px solid #cbd2c2;border-radius:14px;padding:7px 12px;font-size:11px;line-height:1.6}
@media (max-width:460px){#coins{font-size:20px}.coinIcon{width:24px;height:24px;font-size:13px}}
#coins{color:#30483c!important;font-size:20px!important;font-weight:650;letter-spacing:-.04em}.coins{overflow:hidden}
/* v74 (staff 2 + 6): species book - every tree, fish, ore, product and bear loot you have ever obtained */
#dexOpen{border:none;border-radius:999px;padding:7px 12px;font:inherit;font-weight:700;font-size:12px;background:#efe3cf;color:#6b4a2a;cursor:pointer;min-width:84px}
#dexBox{position:absolute;left:8px;right:8px;top:46px;max-height:74%;overflow-y:auto;z-index:6;background:#fff6e2;border:2px solid #e08f3c;border-radius:14px;padding:8px 10px 10px;box-shadow:0 8px 20px rgba(0,0,0,.22);color:#4a3a2c}
#dexBox[hidden]{display:none}
#dexBox .dhd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:900}
#dexBox .dhd b{color:#3f7a55;font-variant-numeric:tabular-nums}
#dexBox .dbar{height:6px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden;margin:5px 0 2px}
#dexBox .dbar i{display:block;height:100%;background:#e08f3c;border-radius:3px}
#dexClose{border:none;background:#efe3cf;color:#6b4a2a;border-radius:999px;width:32px;height:32px;font:inherit;font-weight:900;font-size:14px;cursor:pointer}
#dexBox .dsec{font-size:12px;font-weight:800;color:#6b4a2a;margin:8px 0 4px}
#dexBox .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px}
#dexBox .dc{background:#fffdf6;border:1.5px solid #ead9b8;border-radius:10px;padding:4px 2px 3px;text-align:center;font-size:10.5px;font-weight:700;line-height:1.2;word-break:keep-all}
#dexBox .dc canvas{width:28px;height:28px;display:block;margin:0 auto 2px}
#dexBox .dc.no{color:#9a8a74;background:#f3ead8}
#dexBox .dc.rare{border-color:#e0b23c;background:#fff8d8}
#dexBox .dc.rare.no{background:#f3ead8;border-color:#ead9b8}
#dexBox .dc small{display:block;font-size:9px;font-weight:700;color:#b3263b}
#dexClose:focus-visible,#dexOpen:focus-visible{outline:3px solid var(--moss);outline-offset:2px}
/* v75 (staff 2 + 6): today's goals - three small goals that change every day */
#dayOpen{border:none;border-radius:999px;padding:7px 12px;font:inherit;font-weight:700;font-size:12px;background:#efe3cf;color:#6b4a2a;cursor:pointer;min-width:84px}
#dayOpen.done{background:#3f7a55;color:#fff}
#dayBox{position:absolute;left:8px;right:8px;top:46px;z-index:6;background:#fff6e2;border:2px solid #e08f3c;border-radius:14px;padding:8px 12px 10px;box-shadow:0 8px 20px rgba(0,0,0,.22);color:#4a3a2c;display:flex;flex-direction:column;gap:7px}
#dayBox[hidden]{display:none}
#dayBox .dyh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:900}
#dayBox .dyr{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700}
#dayBox .dyr .dt{display:flex;justify-content:space-between;gap:10px}
#dayBox .dyr .dt span:last-child{font-variant-numeric:tabular-nums;color:#b3263b}
#dayBox .dyr.ok .dt span{color:#3f7a55}
#dayBox .dyb{height:6px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden}
#dayBox .dyb i{display:block;height:100%;background:#e08f3c;border-radius:3px}
#dayBox .dyr.ok .dyb i{background:#4fb36a}
#dayBox .dyf{font-size:11.5px;font-weight:700;color:#7a6650}
#dayClose{border:none;background:#efe3cf;color:#6b4a2a;border-radius:999px;width:32px;height:32px;font:inherit;font-weight:900;font-size:14px;cursor:pointer}
#dayOpen:focus-visible,#dayClose:focus-visible{outline:3px solid var(--moss);outline-offset:2px}

/* v101: winter atelier — paper, forest ink and brass; no full-screen blur or filters. */
:root{--bg:#e7ede3;--panel:#f5f2e7;--ink:#30483c;--sub:#758173;--line:#cbd2c2;--moss:#456552;--coin:#c7ad76;--coinInk:#4c4431;--rose:#b07c68;--off:#dce2d5}
html,body{width:100%;height:100%;height:100dvh;background:#e7ede3;overflow:hidden}
body{display:block;color:#fff}
.app{position:relative;width:100%;max-width:none;height:100%;height:100dvh;display:block;overflow:hidden;background:#e7ede3}
.stage{position:absolute;inset:0;display:block;padding:0;min-height:0;overflow:hidden}
.cwrap{position:absolute;inset:0;margin:auto;overflow:hidden}
canvas#c{width:100%;height:100%;border-radius:0;box-shadow:none;touch-action:none;image-rendering:auto}

    addSs(line,id,put);a.bag[id]-=put;room-=put;n+=put;if(a.bag[id]<=0)delete a.bag[id];

  zoomBtn.textContent=S.zoomOut?'\ud83d\udd0d \ud655\ub300 \ubcf4\uae30':'\ud83d\uddfa\ufe0f \uc804\uccb4\ubcf4\uae30';
  var h='';

  else if(defenseDue())h='⚠️ 곰이 와요! '+(!S.tower?'🗼 망루':'🪵 울타리')+'를 지어요';
  else if(liveBears().length&&time<bearHintT)h='🐻‍❄️ 곰이 돈을 노려요! 잡으면 되찾아요';

  else if((S.rep||[]).length)h='곰에게 부서진 곳은 🔧 수리 버튼으로 싸게 되살릴 수 있어요';
  else if(huntReady()&&!S.tower)h='성벽 가운데 망루를 지으면 사냥꾼이 곰을 막아줘요 · 사냥꾼을 강화하면 내 무기도 세져요';
  else if(LOOT.length)h='곰고기는 생선 가게, 곰 가죽은 나무 가게에 납품하면 비싸게 팔려요';
  else if(['mill','smoke'].some(function(b){return S[b]&&!S.pst[b]&&storeN(b)>=storeCap(b);}))h='가공품이 쌓였어요! 건물 안 [창고 짓기] 발판에 서 있으면 창고가 생기고 트럭이 더 자주 와요';
  else if(!h&&anyPileFull())h='적재칸이 가득! 가운데 [벨트] 발판에 서 있으면 벨트가 설치돼요';
  hint.textContent=h;hint.classList.toggle('hide',!h);
  hint.style.top='46px';
}
var stageEl=document.getElementById('stage'),cwrap=document.getElementById('cwrap');
function fit(){
  var r=stageEl.getBoundingClientRect(),aw=r.width,ah=r.height;
  if(aw<=0||ah<=0)return;
  // Match the displayed canvas exactly: portrait and landscape use the same coordinate scale.
  var nsh=W*ah/aw;
  if(Math.abs(nsh-SH)>.01||Math.abs(screenUnit-W/aw)>.001){
    cancelControl();SH=nsh;screenUnit=W/aw;
    cv.height=Math.ceil(SH*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  cwrap.style.width=aw+'px';
  ZOOM_IN=2.6*Math.min(1,Math.max(.52,ah/aw/1.5));
  Z=S.zoomOut?Math.min(1,SH/HT):ZOOM_IN;
  var pa=agents[0];if(pa){camX=camClampX(pa.x-W/Z/2);camY=camClampY(pa.y-SH/Z*.5);}
  titleT=0;
}
var fitFrame=0;
function scheduleFit(){if(!fitFrame)fitFrame=requestAnimationFrame(function(){fitFrame=0;fit();});}
if(window.ResizeObserver)new ResizeObserver(scheduleFit).observe(stageEl);
window.addEventListener('resize',scheduleFit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleFit);

/* ---------- loop ---------- */
var last=performance.now(),frameGate=last,uiT=0,saveT=0,titleT=0;
function camClampX(x){var vw=W/Z;if(S.zoomOut&&vw>W)return (W-vw)/2;var ax=S.zoomOut?W:Math.min(W,fenceX()+42);return Math.max(0,Math.min(Math.max(0,ax-vw),x));}
function camClampY(y){var vh=SH/Z,ym=HT-vh;if(ym<WORLD_TOP)return ym/2;return Math.max(WORLD_TOP,Math.min(ym,y));}
/* v56: each system runs in its own guard - one bad value in a save can no longer freeze the whole game (hero and workers stop moving).
   the last error is shown in the settings panel so it can be reported */
var ERRN=0,ERRMSG='';function safe(name,fn){try{fn();}catch(e){ERRN++;if(!ERRMSG){ERRMSG=name+': '+(e&&e.message||e);var sv=document.querySelector('#setp .sver');if(sv)sv.textContent='v102 · 오류 '+ERRMSG.slice(0,70);}}}
function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden){last=now;frameGate=now;return;}
  // Cap high-refresh phones at 60 draws/s without changing simulation speed.
  var frameMS=1000/60,elapsed=now-frameGate;
  if(elapsed<frameMS-.1)return;
  frameGate=now-(Math.max(0,elapsed-frameMS)%frameMS);
  var dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now; /* v58: never negative - a frame stamp can be a little older than the moment start was tapped */FDT=dt;
  /* v59: the title card covers the world - repaint it a few times a second instead of every frame (it ran full speed under a blur, which made phones stutter on start) */
  if(TITLE){titleT-=dt;if(titleT<=0){titleT=.4;ctx.setTransform(DPR,0,0,DPR,0,0);safe('draw',draw);}return;}
  /* Story scenes pause the village safely while the player reads. */
  if(storyBox&&!storyBox.hidden){titleT-=dt;if(titleT<=0){titleT=.4;ctx.setTransform(DPR,0,0,DPR,0,0);safe('draw',draw);}return;}
  time+=dt;update(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);safe('draw',draw);
  uiT-=dt;if(uiT<=0){uiT=.2;safe('ui',refreshUI);}
  saveT+=dt;if(saveT>5){saveT=0;save();}
}
/* v58 (staff 7): one simulation step, split out of the frame loop so the automated tests can run the game faster than real time */
function update(dt){
  safe('res',function(){res.forEach(function(q){if(!q.alive&&owned(q.s)){q.timer-=dt;if(q.timer<=0)growRes(q);}});});
  agents.forEach(function(a){try{step(a,dt);}catch(e){safe('agent-'+a.role,function(){throw e;});
    /* v57: even if the hero's normal step fails, the joystick still moves the hero */
    if(a.role==='player'&&joy.on&&Math.hypot(joy.dx,joy.dy)>4*screenUnit){var d=Math.hypot(joy.dx,joy.dy),sp=90*dt;a.x=Math.max(6,Math.min(fenceX()-8,a.x+joy.dx/d*sp));a.y=Math.max(6,Math.min(H-6,a.y+joy.dy/d*sp));a.mv=true;a.bob+=dt*13;a.moving=true;}}});
  safe('belt',function(){updateConveyors(dt);});safe('proc',function(){updateProcessing(dt);});safe('cust',function(){updateCustomers(dt);});safe('truck',function(){updateTrucks(dt);});
  safe('music',updateMusic);safe('pads',function(){updatePads(dt);});safe('fx',function(){updateFly(dt);updateChecks(dt);});safe('tut',updateTut);safe('cash',function(){updateCash(dt);});
  safe('bg',function(){if(palKey()!==bgWh){bgWh=palKey();paintStatic();paintPalisade();}});safe('bears',function(){updateBears(dt);});safe('finale',function(){updateFinale(dt);});safe('endcine',function(){updateEndingCinematic(dt);});safe('def',function(){updateDefense(dt);});
  safe('stage',function(){updateStage(dt);});
  var zt=S.zoomOut?Math.min(1,SH/HT):ZOOM_IN;Z+=(zt-Z)*Math.min(1,dt*5);if(Math.abs(zt-Z)<.002)Z=zt;
  var pa=agents[0],fx=pa.x,ck=Math.min(1,dt*5);if(CAMF){CAMF.t-=dt;fx=CAMF.x;ck=Math.min(1,dt*2.2);if(CAMF.t<=0)CAMF=null;}
  var cxT=camClampX(fx-W/Z/2),cyT=camClampY(pa.y-SH/Z*.5);
  camX+=(cxT-camX)*ck;camY+=(cyT-camY)*ck;camX=camClampX(camX);camY=camClampY(camY);
  for(var f=floats.length-1;f>=0;f--){floats[f].t+=dt;if(floats[f].t>2)floats.splice(f,1);}
  for(var p=parts.length-1;p>=0;p--){var pt=parts[p];pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=pt.g*dt;if(pt.life<=0)parts.splice(p,1);}
  if(flash>0)flash=Math.max(0,flash-dt*1.6);SHAKE=Math.max(0,SHAKE-dt*2.5);TOWERHIT=Math.max(0,TOWERHIT-dt);
  safe('idle',function(){var pa=agents[0];if(tutOn()||S.auto||pa.mv||pa.moving||joy.on)idleT=0;else idleT+=dt;});
}
/* v58 (staff 7): regression-test hook - only exists when the page is opened with ?test=1 (never in normal play).
   lets the headless test bot read the state, buy upgrades and fast-forward the simulation */
if(/[?&]test=1/.test(location.search))window.__qlen=function(){return customers.filter(function(c){return c.state!=='out';}).length;};
if(/[?&]test=1/.test(location.search))window.__stuck=function(){return res.filter(function(q){return q.alive&&q.k==='fish'&&q.by&&(agents.indexOf(q.by)<0||q.by.res!==q);}).length;};
if(/[?&]test=1/.test(location.search))window.__cozyTest={S:function(){return S;},DEF:DEF,buy:function(id){
    /* QA purchases walk the test hero onto the same world pad and wait through the real dwell/payment path. */
    var d=DEF[id];if(!d||d.isMax()||!d.canBuy()||(d.hidden&&d.hidden()))return false;PADLIST=buildPads();var pad=null;
    for(var i=0;i<PADLIST.length;i++)if(PADLIST[i].id===id){pad=PADLIST[i];break;}if(!pad)return false;
    var a=agents[0],coinsBefore=S.coins;a.x=pad.x;a.y=pad.y;a.path=[];a.tap=null;a.moving=false;a.mv=false;a.padDwell=0;padInit=true;padHold=null;padHoldP=null;
    for(var f=0;f<60;f++){updatePads(.05);if((!S.pads||!S.pads[id])&&S.coins<coinsBefore)break;}
    return S.coins<coinsBefore&&(!S.pads||!S.pads[id]);
  },
  goals:function(){var l=goalList();return l?l.map(function(q){return {name:q[0],v:q[1](),need:q[2]};}):null;},errs:function(){return {n:ERRN,msg:ERRMSG,boot:window.__bootErr};},
  start:function(){TITLE=false;titleEl.hidden=true;},run:function(sec,stepDt){var h=stepDt||.05,n=Math.round(sec/h);for(var i=0;i<n;i++){time+=h;FDT=h;update(h);}refreshUI();return S.coins;},
  pads:function(){return PADLIST.map(function(p){return {id:p.id,x:p.x,y:p.y,w:50,h:48,cap:p.cap||'',mini:p.mini};});},padOverlaps:function(){PADLIST=buildPads();var hits=[];for(var i=0;i<PADLIST.length;i++)for(var j=i+1;j<PADLIST.length;j++){var a=PADLIST[i],b=PADLIST[j];if(Math.abs(a.x-b.x)<50&&Math.abs(a.y-b.y)<48)hits.push([a.id,b.id]);}return hits;},cost:function(id){return DEF[id]?DEF[id].cost():null;},agents:function(){return agents;},hero:function(x,y){var a=agents[0];a.x=x;a.y=y;a.path=[];a.tap=null;},dex:function(){return {n:dexN(),tot:DEXALL.length,ids:Object.keys(S.dex||{})};},day:function(){return {daily:S.daily,stat:S.stat,done:dayDoneN()};},beltfx:function(){return BELTFX;},bears:function(){return BEARS;},
  geo:function(){return {GC:GC,MX:MX,W:W,H:H,HT:HT,STAGE_W:STAGE_W,areaW:areaW(),fenceX:fenceX(),camClampX0:camClampX(0),camClampXmax:camClampX(MX),siteM1:{x:SITE.m1.x,gather:SITE.m1.gather,st:SITE.m1.st,pt:SITE.m1.pt},canvasW:cv.width,canvasH:cv.height,villageAt_fx:villageAt(fenceX()-1)};},
  spawnBear:function(){spawnBear();},banner:function(){return STAGEBAN?{text:STAGEBAN.text,sub:STAGEBAN.sub}:null;}};

function boot(name,fn){try{fn();}catch(e){var m=name+': '+(e&&e.message||e);if(!window.__bootErr)window.__bootErr=m;var t=document.getElementById('tinfo');if(t){t.textContent='⚠️ '+m;t.style.color='#b3263b';}var v=document.querySelector('#setp .sver');if(v)v.textContent='v102 · 오류 '+m.slice(0,70);}}

boot('dex',function(){dexInit();DEXREADY=true;});boot('tab',applyTab);boot('ui',refreshUI);
boot('fit',fit);boot('cam',function(){var pa=agents[0];Z=S.zoomOut?Math.min(1,SH/HT):ZOOM_IN;camX=camClampX(pa.x-W/Z/2);camY=camClampY(pa.y-SH/Z*.5);});
