<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포근한 숲속 마을</title>
<link rel="stylesheet" href="styles/game.css?v=710396a4cb60">
</head>
<body>
<div class="app">
  <header>
    <div class="coins"><div class="coinIcon">₩</div><div id="coins">0</div><button id="goal" type="button" aria-expanded="false" hidden><span class="gt"></span><span class="gb"><i></i></span><span class="gn"></span></button></div>
    <div class="meta"><div id="m1"></div><div id="m2"></div></div>
    <span id="bearChip" hidden role="timer"></span>
  </header>
  <div id="eventToast" role="status" hidden></div>
  <div id="raidRadar" hidden aria-label="곰 위치 지도"><span id="radarLabel"></span><canvas id="radarCanvas" width="224" height="128"></canvas></div>
  <div class="inv" id="inv" aria-label="판매대 재고"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="drawer" id="drawer" hidden></div>
  <div class="stage" id="stage">
    <div class="cwrap" id="cwrap">
      <canvas id="c" aria-label="숲속 마을 지도"></canvas>
      <div id="hint"></div>
      <div id="goalList" hidden></div>
      <div id="dexBox" hidden role="dialog" aria-label="품종 도감"></div>
      <div id="dayBox" hidden role="dialog" aria-label="오늘의 목표"></div>
      <div id="storyBox" hidden role="dialog" aria-modal="true" aria-label="마을 이야기"><div class="storyCard"><div class="storyHead"><small id="storyKicker">포근한 숲속 마을 · 이야기책</small><button class="storyClose" id="storyClose" type="button" aria-label="이야기 닫기">✕</button></div><section id="storyBook" hidden><h2 class="storyHeadline">마을 이야기</h2><p style="font-size:12px;color:#728075;margin:-5px 0 12px">열린 마을의 이야기를 다시 읽을 수 있어요.</p><div class="storyList" id="storyList"></div></section><section id="storyPlayer" hidden><div class="storyArt" id="storyArt"><div class="storyLandscape" id="storyLandscape">🌲</div><div class="storyCloud" id="storyCloud">❄️</div></div><div class="storyChapter" id="storyChapter"></div><h2 class="storyHeadline" id="storyHeadline"></h2><div class="storySpeaker"><span class="storyAvatar" id="storyAvatar">🕯️</span><span id="storySpeakerName">마을지기</span></div><div class="storyText" id="storyText"></div><div class="storyProgress" id="storyProgress"></div><div class="storyActions"><button class="storyBtn alt" id="storySkip" type="button">이야기책으로</button><button class="storyBtn" id="storyNext" type="button">다음</button></div></section></div></div>
      <button id="gear" type="button" aria-expanded="false" aria-controls="setp" aria-label="설정">⚙️</button>
      <div id="setp" hidden>
        <div class="srow"><span>조작</span><button id="mode" type="button" aria-pressed="false">🕹️ 직접 조작</button></div>
        <div class="srow"><span>새 게임</span><button id="newGame" type="button">🔄 처음부터</button></div>
        <div class="srow"><span>지도</span><button id="zoomBtn" type="button">🗺️ 전체보기</button></div>
        <div class="srow"><span>소리</span><div class="snd"><button id="sfxBtn" type="button" aria-pressed="true" aria-label="효과음">🔊</button><button id="bgmBtn" type="button" aria-pressed="true" aria-label="배경음악">🎵</button></div></div>
        <div class="srow"><span>다음 마을</span><button id="goalOpen" type="button" style="border:none;border-radius:999px;padding:7px 12px;font:inherit;font-weight:700;font-size:12px;background:#efe3cf;color:#6b4a2a;cursor:pointer">🚧 조건 보기</button></div>
        <div class="srow"><span>조작 감도</span><button id="sensBtn" type="button">🎚️ 보통</button></div>
        <div class="srow"><span>도감</span><button id="dexOpen" type="button">📖 0/0</button></div>
        <div class="srow"><span>이야기</span><button id="storyOpen" type="button">📚 마을 이야기</button></div>
        <div class="srow"><span>오늘의 목표</span><button id="dayOpen" type="button">🎯 0/3</button></div>
        <div class="sver">포근한 숲속 마을 v103</div>
      </div>
      <div id="title" role="region" aria-label="책 속으로 떠나는 여행"><img id="introImage" hidden alt=""><img id="introImageNext" hidden alt="" aria-hidden="true"><div class="introControls"><button id="introBack" type="button" hidden aria-label="이전 장면">‹</button><button id="startBtn" type="button" aria-label="게임 시작">▶</button><button id="introSkip" type="button" hidden aria-label="인트로 건너뛰고 게임 시작">»</button></div><div id="introDots" aria-hidden="true"></div><div class="tinfo" id="tinfo" hidden role="alert"></div></div>
      <div id="ending" hidden role="dialog" aria-label="엔딩"><div class="tcard"><div class="tlogo" aria-hidden="true">🏆</div><h1>엔딩</h1><p class="tsub">세 마을의 창마다 불빛이 켜지고, 얼음 아래 푸른 물길이 흘러요. 겨울은 아직 남았지만 이제 마을은 혼자가 아니에요.</p>
        <button id="endBtn" type="button">🔄 다시 플레이</button></div></div>
    </div>
  </div>
</div>
<nav id="quickDock" aria-label="빠른 메뉴" hidden>
    <button type="button" id="quickJournal"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v15M3 4c4-1 7-1 9 1 2-2 5-2 9-1v15c-4-1-7-1-9 1-2-2-5-2-9-1Z"/></svg></span><small>이야기</small></button>
    <button type="button" id="quickDay"><span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 3h6v3H9zm0 10 2 2 4-5"/></svg></span><small>오늘 목표</small></button>
    <button type="button" id="quickMap"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Zm6-3v15m6-12v15"/></svg></span><small>지도</small></button>
    <button type="button" id="quickSettings"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2" fill="#f7f4e9"/><circle cx="15" cy="12" r="2" fill="#f7f4e9"/><circle cx="10" cy="18" r="2" fill="#f7f4e9"/></svg></span><small>메뉴</small></button>
  </nav>

<script src="intro-scenes.js"></script>
<script src="runtime.js?v=da2a94f422b5"></script>
</body>
</html>
